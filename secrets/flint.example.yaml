# Template for secrets/flint.enc.yaml (the real file is SOPS/age-encrypted and gitignored).
# Create/edit the real one with:  sops secrets/flint.enc.yaml
flint:
  # Master password: lets the app unlock itself on startup. Remove to disable auto-unlock.
  master_password: CHANGE_ME
split_vpns:
  # Key = the split VPN's "SOPS reference" in the app.
  work:
    username: CHANGE_ME        # optional; overrides the username set in the app
    password: CHANGE_ME
    totp_secret: CHANGE_ME     # base32 secret or otpauth://totp/... URI
